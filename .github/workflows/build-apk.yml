# ─────────────────────────────────────────────────────────────────────────────
# AYANO TEST PASS — Auto Build APK
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS DOES: Every time you push code to GitHub, this automatically
# builds your APK. You download it from the "Actions" tab → "Artifacts".
#
# SETUP STEPS (do this once):
# 1. Go to your GitHub repo → Settings → Secrets and variables → Actions
# 2. Add these secrets:
#    • CLOUDINARY_CLOUD_NAME  → your Cloudinary cloud name
#    • CLOUDINARY_API_KEY     → your Cloudinary API key
#    • CLOUDINARY_API_SECRET  → your Cloudinary API secret
#    • GEMINI_API_KEY         → from aistudio.google.com (free)
# 3. Make sure google-services.json is inside the app/ folder in your repo
# ─────────────────────────────────────────────────────────────────────────────

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java (Android needs Java 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Cache Gradle files so builds are faster next time
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # Step 4: Create .env file with your API keys from GitHub Secrets
      - name: Create .env file
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          # Inject secrets into .env
          # HINT: These come from GitHub → Settings → Secrets and variables → Actions
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      # Step 5: Set up the debug keystore (needed to sign the APK)
      - name: Set up debug keystore
        run: |
          chmod +x gradlew
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          # If no debug keystore exists at all, generate one automatically
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

      # Step 6: Check that google-services.json exists
      # HINT: You must upload this file to the app/ folder in your GitHub repo.
      # Download it from Firebase Console → Project Settings → Your Android app.
      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing!"
            echo "Download it from Firebase Console → Project Settings → Android app"
            echo "Then upload it to the app/ folder in your GitHub repo"
            exit 1
          fi
          echo "google-services.json found ✅"

      # Step 7: Build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 8: Upload the APK so you can download it
      # HINT: After the build finishes, click the build in Actions tab,
      # scroll down to "Artifacts" and download your APK zip file.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayano-test-pass-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30  # APK stays available for 30 days

      # Step 9: Show the APK file size so you know it built correctly
      - name: Show APK info
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK built successfully!"
            echo "📦 File: $APK"
            echo "📏 Size: $SIZE"
          fi
